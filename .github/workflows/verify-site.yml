name: Verify published website
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-site.yml'
      - 'index.html'
      - 'assets/guide-enhancements.js'
      - 'assets/main-settings.js'
      - 'scripts/test_site.py'
      - 'scripts/test_settings.py'
      - 'scripts/test_dialog_size.py'
      - 'maintenance/verify_live.py'
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-published-guide
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install browser validation tools
        run: |
          python -m pip install Pillow playwright
          python -m playwright install chromium --with-deps
      - name: Test waypoint navigation, photo galleries, and seven screen sizes
        run: python -u scripts/test_site.py
      - name: Verify live HTTPS files, photographs, and rest-day navigation
        run: python -u maintenance/verify_live.py
      - name: Verify main-page settings, search, focus, and saved preferences on the live site
        env:
          SITE_URL: https://25d-228.github.io/kyushu-cycle-guide/
        run: python -u scripts/test_settings.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-site-verification
          path: |
            live-verification.json
            browser-test-report.json
            settings-test-report.json
            settings-*.png
            live-*.png
            test-*.png
          retention-days: 7
