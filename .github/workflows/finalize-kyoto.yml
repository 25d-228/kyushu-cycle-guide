name: Finalize Kyoto round trip
on:
  push:
    branches: [feature/kyoto-round-trip]
    paths: ['.github/workflows/finalize-kyoto.yml','maintenance/finalize_kyoto.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prepare-kyoto
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kyoto-round-trip
      - name: Finish shared mouse and keyboard navigation
        run: |
          python -u maintenance/finalize_kyoto.py
          node --check assets/guide-enhancements.js
          node --check assets/kyoto-trip.js
          node --check assets/kyoto-details.js
      - name: Install browser test tools
        run: |
          python -m pip install Pillow playwright
          python -m playwright install chromium --with-deps
      - name: Verify all four itineraries and existing settings
        run: |
          python -u scripts/test_site.py
          python -u scripts/test_settings.py
          python -u scripts/test_kaikyokan.py
          python -u scripts/test_kyoto.py
      - name: Commit validated publication source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/test_kyoto.py '*-report.json'
          if ! git diff --cached --quiet; then
            git commit -m 'Verify Kyoto trip controls, hotel visit dates and seven responsive layouts'
            git push origin HEAD:feature/kyoto-round-trip
          fi
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-final-validation
          path: |
            index.html
            assets/
            scripts/
            maintenance/
            *-report.json
            kyoto-*.png
          retention-days: 7
