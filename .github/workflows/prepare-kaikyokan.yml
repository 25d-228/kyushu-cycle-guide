name: Prepare Kaikyokan trial
on:
  push:
    branches: [feature/kaikyokan-trial]
    paths:
      - '.github/workflows/prepare-kaikyokan.yml'
      - 'scripts/kaikyokan_*.py'
      - 'scripts/add_kaikyokan.py'
      - 'scripts/test_kaikyokan.py'
      - 'assets/trip-catalog.js'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kaikyokan-trial-build
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kaikyokan-trial
      - name: Install image and browser test tools
        run: |
          python -m pip install Pillow playwright
          python -m playwright install chromium --with-deps
      - name: Add the independent itinerary and transport-aware navigation
        run: |
          python -u scripts/add_kaikyokan.py
          node --check assets/trip-catalog.js
          node --check assets/guide-enhancements.js
      - name: Add licensed photographs for the new stops
        run: python -u scripts/kaikyokan_photos.py
      - name: Test all existing routes and responsive dialogs
        run: python -u scripts/test_site.py
      - name: Test the aquarium trial, its rest day, and main-page settings
        run: python -u scripts/test_kaikyokan.py
      - name: Commit only validated site changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/ PHOTO-CREDITS.md scripts/test_site.py kaikyokan-*-report.json browser-test-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add validated five-day Kaikyokan trial beside inland trial and Kyushu journey'
            git push origin HEAD:feature/kaikyokan-trial
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaikyokan-trial-validation
          path: |
            index.html
            assets/
            scripts/
            maintenance/
            PHOTO-CREDITS.md
            kaikyokan-*.json
            kaikyokan-*.png
            browser-test-report.json
            test-mobile.png
          retention-days: 7
