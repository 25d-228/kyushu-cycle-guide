name: Finalize curated photo guide
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-photo-guide.yml','maintenance/finalize_site.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prepare-photo-guide
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install validation tools
        run: |
          python -m pip install Pillow playwright
          python -m playwright install chromium --with-deps
      - name: Finalize the reviewed photo selection and credit links
        run: python -u maintenance/finalize_site.py
      - name: Validate every waypoint and the rest-day galleries
        run: python -u scripts/test_site.py
      - name: Record verified publication source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html assets scripts PHOTO-CREDITS.md photo-build-report.json browser-test-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize reviewed destination photographs and natural Japanese copy'
            git push origin HEAD:main
          fi
          echo "PREPARED_COMMIT=$(git rev-parse HEAD)"
          echo "PREPARED_TREE=$(git rev-parse HEAD^{tree})"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-photo-guide-checks
          path: |
            photo-build-report.json
            browser-test-report.json
            test-*.png
          retention-days: 7
