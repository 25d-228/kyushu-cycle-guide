name: Prepare Kyoto round trip
on:
  push:
    branches: [feature/kyoto-round-trip]
    paths:
      - '.github/workflows/prepare-kyoto.yml'
      - 'scripts/*kyoto*'
      - 'assets/kyoto-*'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prepare-kyoto
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kyoto-round-trip
      - name: Install image, coastline and browser test tools
        run: |
          python -m pip install Pillow playwright basemap shapely
          python -m playwright install chromium --with-deps
      - name: Add the itinerary and context-aware rest and hotel dates
        run: |
          python -u scripts/add_kyoto.py
          node --check assets/kyoto-trip.js
          node --check assets/kyoto-details.js
          node --check assets/trip-catalog.js
          node --check assets/guide-enhancements.js
      - name: Cache licensed photographs and extend the overview map
        run: python -u scripts/kyoto_assets.py
      - name: Verify existing trips, navigation, settings and photograph rendering
        run: |
          python -u scripts/test_site.py
          python -u scripts/test_settings.py
          python -u scripts/test_kaikyokan.py
      - name: Verify the Kyoto round trip and consecutive rest days
        run: python -u scripts/test_kyoto.py
      - name: Save only validated website source on the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets scripts maintenance PHOTO-CREDITS.md '*-report.json'
          if ! git diff --cached --quiet; then
            git commit -m 'Add tested Kyoto round trip, licensed photographs and extended western Japan map'
            git push origin HEAD:feature/kyoto-round-trip
          fi
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-round-trip-validation
          path: |
            index.html
            assets/
            scripts/
            maintenance/
            PHOTO-CREDITS.md
            *-report.json
            kyoto-*.png
            test-mobile.png
          retention-days: 7
